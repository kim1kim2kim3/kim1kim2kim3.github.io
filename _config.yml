```yaml
# The Site Configuration

# Import the theme
theme: jekyll-theme-chirpy

# The language of the webpage
lang: en

# Timezone
timezone: Asia/Seoul

# jekyll-seo-tag settings
# ↓ --------------------------

# Site title
title: Dev Notes

# Subtitle displayed with the site title
tagline: 배우고 만들고 기록합니다.

# Used by SEO meta tags and the Atom feed
description: >-
  공부한 내용과 개발, 프로젝트, 논문 등 관심 있는 주제를 기록하는 개인 블로그입니다.

# Site URL
url: "https://kim1kim2kim3.github.io"

github:
  username: kim1kim2kim3

# Leave empty if you do not use Twitter/X
twitter:
  username:

social:
  # Displayed as the default author and copyright owner
  name: kim1kim2kim3

  # Leave empty unless you want your email publicly associated with the site
  email:

  fediverse_handle:

  links:
    - https://github.com/kim1kim2kim3

# Site Verification Settings
webmaster_verifications:
  google:
  bing:
  alexa:
  yandex:
  baidu:
  facebook:

# ↑ --------------------------
# The end of `jekyll-seo-tag` settings


# Web Analytics Settings
analytics:
  google:
    id:
  goatcounter:
    id:
  umami:
    id:
    domain:
  matomo:
    id:
    domain:
  cloudflare:
    id:
  fathom:
    id:

# Page views settings
pageviews:
  provider:


# Prefer color scheme setting.
#
# Keep empty to follow the system setting.
# Users can switch between dark and light mode
# using the button at the bottom of the sidebar.
#
# Available options:
#   light
#   dark
theme_mode:


# CDN endpoint for media resources
cdn:


# Avatar displayed in the sidebar
#
# Example:
# avatar: /assets/img/avatar.png
avatar:


# Site-wide social preview image
social_preview_image:


# Global switch for the Table of Contents in posts
toc: true


# Post actions
actions:
  edit_post:
    enabled: false
    url: ""
    static_url: false


# Comments
comments:
  # Leave empty to disable comments globally
  provider:

  disqus:
    shortname:

  utterances:
    repo:
    issue_term:

  giscus:
    repo:
    repo_id:
    category:
    category_id:
    mapping:
    strict:
    input_position:
    lang:
    reactions_enabled:


# Self-hosted static assets
assets:
  self_host:
    enabled:
    env:


# Progressive Web App
pwa:
  enabled: true

  cache:
    enabled: true

    deny_paths:
      # - "/example"


# Number of posts per page
paginate: 10


# Base URL
#
# For https://kim1kim2kim3.github.io,
# keep this empty.
baseurl: ""


# ------------ The following options are not recommended to be modified ------------

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge

  syntax_highlighter_opts:
    css_class: highlight

    span:
      line_numbers: false

    block:
      line_numbers: true
      start_line: 1


collections:
  tabs:
    output: true
    sort_by: order


defaults:
  - scope:
      path: ""
      type: posts

    values:
      layout: post
      comments: true
      toc: true

      # Do not modify unless you also update all post links
      permalink: /posts/:title/

  - scope:
      path: _drafts

    values:
      comments: false

  - scope:
      path: ""
      type: tabs

    values:
      layout: page
      permalink: /:title/


sass:
  style: compressed


compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false

  ignore:
    envs: [development]


exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - purgecss.js
  - "*.config.js"
  - "package*.json"


jekyll-archives:
  enabled: [categories, tags]

  layouts:
    category: category
    tag: tag

  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
```
